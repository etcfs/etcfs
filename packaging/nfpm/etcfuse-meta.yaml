# nfpm package spec for etcfuse-meta (Go metadata backend).
#
# Built by CI's release-assets job, one call per target (deb/rpm), with
# VERSION substituted from the semantic-release tag and dist/etcfuse-meta
# already cross-compiled. Not runnable standalone without both env vars set.
#
# Test locally:
#   VERSION=0.0.0 nfpm package -f packaging/nfpm/etcfuse-meta.yaml -p deb -t /tmp
name: etcfuse-meta
arch: amd64
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: Muhamad Huseyn Salman
homepage: https://github.com/etcfs/etcfs
license: Apache-2.0
description: |
  EtcFS metadata backend — etcd-backed namespace, locking, allocation and
  block I/O engine. Pairs with etcfuse (the FUSE frontend) over a Unix
  socket; see https://etcfs.github.io/etcfs/deployment/binaries/.

contents:
  - src: dist/etcfuse-meta
    dst: /usr/local/bin/etcfuse-meta
    file_info:
      mode: 0755
  - src: deploy/systemd/etcfuse-meta.service
    dst: /usr/lib/systemd/system/etcfuse-meta.service
    file_info:
      mode: 0644

scripts:
  postinstall: packaging/nfpm/scripts/postinstall.sh
