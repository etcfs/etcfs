# Default values for etcfs-csi.
#
# The chart assumes EtcFS itself is already running on the nodes — the daemon
# holds the membership lease and the FUSE mount, and this driver only publishes
# subdirectories of that mount. Installing the chart on a cluster without the
# daemon gives you a driver that refuses to publish, which is the intended
# failure: an unmounted host would otherwise hand pods a local directory.

driverName: csi.etcfs.io

image:
  repository: ghcr.io/etcfs/etcfs-csi
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

# Where the EtcFS daemon mounts the filesystem on each host. CSI volumes are
# subdirectories of it.
mountPath: /mnt/etcfs

# Kubelet's root directory; the node plugin's socket and every target path live
# under it. Non-default on some distributions (k3s, older OpenShift).
kubeletDir: /var/lib/kubelet

etcd:
  # Required. The EtcFS cluster's etcd, never the Kubernetes control plane's:
  # filesystem metadata is a high-churn data-plane workload and would exhaust
  # the API server's etcd.
  endpoints: ""      # e.g. "https://etcd-0:2379,https://etcd-1:2379"
  # Optional client TLS, mounted from a secret with ca.crt / tls.crt / tls.key.
  tlsSecretName: ""

controller:
  replicaCount: 1
  # The controller creates and deletes volume directories through the
  # filesystem, so it must land on a node that has the EtcFS mount.
  nodeSelector: {}
  tolerations: []
  resources: {}
  # Upstream sidecars. Pinned rather than :latest so an upgrade is a commit.
  provisionerImage: registry.k8s.io/sig-storage/csi-provisioner:v5.1.0
  attacherImage: registry.k8s.io/sig-storage/csi-attacher:v4.7.0

node:
  nodeSelector: {}
  tolerations:
    - operator: Exists
  resources: {}
  registrarImage: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.12.0

storageClass:
  create: true
  name: etcfs
  # Retain is the safer default for a shared filesystem: Delete removes the
  # volume's directory and everything under it when the claim goes away.
  reclaimPolicy: Retain
  isDefault: false
  parameters: {}
