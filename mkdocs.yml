site_name: EtcFS
site_description: A Raft/etcd-coordinated cluster filesystem over shared raw block storage
repo_url: https://github.com/etcfs/etcfs
repo_name: etcfs/etcfs
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - search.suggest

markdown_extensions:
  - tables
  - fenced_code
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Deployment:
      - Overview: deployment/index.md
      - Infrastructure (Terraform): deployment/terraform.md
      - Autoscaling (ASG): deployment/autoscaling.md
      - Binaries and Containers: deployment/binaries.md
      - Configuration: deployment/configuration.md
      - etcfsctl CLI: deployment/etcfsctl.md
      - Kubernetes (CSI Driver): deployment/kubernetes-csi.md
      - Monitoring: deployment/monitoring.md
  - Architecture:
      - FUSE Layer:
          - FUSE Daemon Architecture: architecture/fuse/fuse-architecture.md
          - FUSE Request Dispatch: architecture/fuse/fuse-request-dispatch.md
          - FUSE Read Operations: architecture/fuse/fuse-read-operations.md
          - FUSE Write Operations: architecture/fuse/fuse-write-operations.md
          - FUSE Cache Management: architecture/fuse/fuse-cache-management.md
      - Metadata & Namespace:
          - Metadata Schema: architecture/metadata/metadata-schema.md
          - Metadata Store: architecture/metadata/metadata-store.md
          - Namespace Operations: architecture/metadata/namespace-operations.md
          - POSIX Lock Operations: architecture/metadata/posix-lock-operations.md
          - Concurrency Control: architecture/metadata/concurrency-control.md
          - Lock Caching and Recall: architecture/metadata/lock-caching.md
      - Storage Substrate:
          - Block Device I/O Substrate: architecture/storage/block-device-io.md
          - Arena Allocator: architecture/storage/arena-allocator.md
          - Write Ordering Invariants: architecture/storage/write-ordering-invariants.md
          - "Kleppmann's Stale-Write Hazard Analysis": architecture/storage/kleppmann-stale-write-analysis.md
      - Consistency:
          - Consistency and Durability Model: architecture/consistency/consistency-and-durability-model.md
          - Cache Coherence and Data Consistency: architecture/consistency/cache-coherence.md
          - Multi-Node Cache Coherence: architecture/consistency/multi-node-coherence.md
      - Fencing:
          - Self-Fencing Watchdog: architecture/fencing/self-fencing-watchdog.md
          - External Fencing Controller: architecture/fencing/external-fencing-controller.md
          - Fencing Generation Protocol: architecture/fencing/fencing-generation-protocol.md
      - Reliability:
          - Continuous Scrubber: architecture/reliability/continuous-scrubber.md
          - Crash Recovery and Deterministic Replay: architecture/reliability/crash-recovery-determinism.md
          - Deterministic Fault-Injection Simulator: architecture/reliability/deterministic-simulator.md
          - Invariant Checkers: architecture/reliability/invariant-checkers.md
          - Performance Benchmarks: architecture/reliability/performance-benchmarks.md
      - Cluster Operations:
          - Elastic Join and Leave: architecture/cluster-ops/elastic-join-leave.md
          - Single-Node Integration: architecture/cluster-ops/single-node-integration.md
          - "MockStore: In-Memory etcd Simulation": architecture/cluster-ops/mock-store.md
          - Observability: architecture/cluster-ops/observability.md
  - Verification:
      - Overview: verification/index.md
      - "POSIX Conformance (pjdfstest)": verification/pjdfstest.md
      - "Linearizability (Porcupine)": verification/porcupine.md
      - "Protocol Model Checking (TLA+)": verification/tla-plus.md
  - Reports:
      - Chaos Reports:
          - Fresh Cluster Per Scenario: reports/chaos-reports/fresh-cluster-per-scenario.md
          - Single-Cluster and Fuzz: reports/chaos-reports/single-cluster-and-fuzz.md
