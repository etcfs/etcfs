name: Dependabot auto-merge

# Turns on GitHub's auto-merge for Dependabot's minor and patch updates. The
# merge queue on main then tests each one on top of the current main and merges
# it only if the required checks pass there.
# Major updates are left for a person: the required checks do not run the
# release job, so a passing pull request says nothing about whether a new major
# version of a release action still publishes. The squash commit keeps the
# repository's header-only convention: the queue's squash commit takes the
# pull request's title, rewritten here into the past tense, and no body (a
# repository setting).
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Read the update type
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Enable auto-merge
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          gh pr edit "$PR_URL" --title "${TITLE/ bump / bumped }"
          # A merge queue sets the method itself and rejects one; without a
          # queue, gh needs one.
          gh pr merge --auto "$PR_URL" || gh pr merge --auto --squash "$PR_URL"
