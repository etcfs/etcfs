name: CI / Release

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

jobs:
  lint-go:
    name: Lint (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The version lives in .golangci-version so CI and the pre-push hook
      # install the same linter; a local one built with a different Go reports
      # different findings, or refuses go.mod's target outright.
      - id: linter
        run: echo "version=$(cat .golangci-version)" >> "$GITHUB_OUTPUT"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.linter.outputs.version }}
          args: --timeout=5m

  lint-c:
    name: Lint (C)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: clang-format check
        run: |
          sudo apt-get install -y clang-format
          find cmd/etcfuse pkg/fuse pkg/block test/c \
            -name '*.c' -o -name '*.h' \
            -exec clang-format --dry-run --Werror {} +

  lint-sh:
    name: Lint (Bash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: |
          sudo apt-get install -y shellcheck
          shellcheck scripts/infra/*.sh scripts/test/*.sh

  build-go:
    name: Build (Go)
    runs-on: ubuntu-latest
    needs: [lint-go]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./cmd/etcfuse-meta

  build-c:
    name: Build (C)
    runs-on: ubuntu-latest
    needs: [lint-c]
    steps:
      - uses: actions/checkout@v7
      - name: Install deps
        run: sudo apt-get install -y libfuse3-dev
      - name: Build
        run: make -C cmd/etcfuse
      - name: Test
        run: make test-c

  test-go:
    name: Test (Go)
    runs-on: ubuntu-latest
    needs: [build-go]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  test-integration:
    name: Test (Integration)
    runs-on: ubuntu-latest
    needs: [build-go, build-c]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Start etcd
        run: |
          curl -sL https://github.com/etcd-io/etcd/releases/download/v3.5.18/etcd-v3.5.18-linux-amd64.tar.gz | tar xz
          sudo mv etcd-v3.5.18-linux-amd64/etcd etcd-v3.5.18-linux-amd64/etcdctl /usr/local/bin/
          mkdir -p /tmp/etcd-data
          etcd --data-dir=/tmp/etcd-data --listen-client-urls=http://127.0.0.1:2379 --advertise-client-urls=http://127.0.0.1:2379 &
          sleep 3
          etcdctl endpoint health
      - name: Run integration tests
        env:
          ETCD_ENDPOINTS: http://127.0.0.1:2379
        # -race here and not only in test-go: the integration suite is the
        # only place the lock cache, the flusher and the recall path run
        # against a real etcd and each other, which is where a data race would
        # actually show up.
        run: go test -race -tags=integration -count=1 -timeout 900s ./...

  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    needs:
      [
        lint-go,
        lint-c,
        lint-sh,
        build-go,
        build-c,
        test-go,
        test-integration,
      ]
    if: github.event_name == 'push'
    outputs:
      released: ${{ steps.semrel.outputs.new_release_published }}
      version: ${{ steps.semrel.outputs.new_release_version }}
      version_major: ${{ steps.semrel.outputs.new_release_major_version }}
      version_minor: ${{ steps.semrel.outputs.new_release_minor_version }}
      version_patch: ${{ steps.semrel.outputs.new_release_patch_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run semantic-release
        id: semrel
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-assets:
    name: Release assets (binaries, packages, containers)
    runs-on: ubuntu-latest
    needs: [release]
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: v${{ env.VERSION }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # GOTOOLCHAIN=auto, not the job-wide `local` setup-go pins: nfpm's go.mod
      # requires a newer Go than go.mod's 1.24 (itself pinned for
      # golangci-lint compat, see go.mod). `local` refuses to fetch it and
      # fails the install outright; `auto` downloads the toolchain nfpm
      # needs for this one command without touching go.mod.
      - name: Install nfpm
        run: GOTOOLCHAIN=auto go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2

      # Both Go binaries are CGO_ENABLED=0: static, no glibc version to match
      # against whatever distro the .deb/.rpm lands on.
      - name: Build Go binaries
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X github.com/etcfs/etcfs/internal/config.Version=${VERSION}"
          CGO_ENABLED=0 go build -ldflags="$LDFLAGS" -o dist/etcfuse-meta ./cmd/etcfuse-meta
          CGO_ENABLED=0 go build -ldflags="$LDFLAGS" -o dist/etcfsctl ./cmd/etcfsctl

      # etcfuse links libfuse3 dynamically, so unlike the Go binaries it
      # does need to match the glibc of wherever it runs. Built here on
      # ubuntu-latest (glibc ~2.39+) it linked GLIBC_2.38 symbols that
      # don't exist on Amazon Linux 2023 (glibc 2.34, the AMI family every
      # deployment doc and the etcfs-terraform-modules repo target) — the
      # released binary failed to even start there with "version
      # `GLIBC_2.38' not found". Found running the ASG deployment path
      # against a real AL2023 instance, not by inspection. Built inside the
      # same amazonlinux:2023 image deploy/docker/Dockerfile.etcfuse already
      # builds the daemon in, instead of the ubuntu-latest job's own cc.
      - name: Build etcfuse (AL2023 container, for glibc compat)
        run: |
          docker run --rm -v "$PWD:/build" -w /build amazonlinux:2023 bash -c '
            dnf install -y -q gcc fuse3-devel &&
            cc -I. -Wall -Wextra -Werror -std=c11 -D_GNU_SOURCE -O2 -g \
              cmd/etcfuse/main.c pkg/fuse/fuse.c pkg/fuse/ops.c pkg/block/block.c \
              -o dist/etcfuse -lfuse3 -lpthread
          '

      - name: Package tarballs
        run: |
          for bin in etcfuse etcfuse-meta etcfsctl; do
            tar czf "dist/${bin}-${VERSION}-linux-amd64.tar.gz" -C dist "$bin"
          done

      - name: Package deb/rpm
        run: |
          for spec in etcfuse etcfuse-meta etcfsctl; do
            nfpm package -f "packaging/nfpm/${spec}.yaml" -p deb -t dist/
            nfpm package -f "packaging/nfpm/${spec}.yaml" -p rpm -t dist/
          done

      - name: Checksums
        run: |
          cd dist
          rm -f etcfuse etcfuse-meta etcfsctl  # raw binaries stay out of the release, only the archives/packages do
          sha256sum *.tar.gz *.deb *.rpm > checksums.txt
          cat checksums.txt

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${VERSION}" dist/*.tar.gz dist/*.deb dist/*.rpm dist/checksums.txt --clobber

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push etcfuse-meta image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile.etcfuse-meta
          build-args: VERSION=${{ env.VERSION }}
          push: true
          tags: |
            ghcr.io/etcfs/etcfuse-meta:${{ env.VERSION }}
            ghcr.io/etcfs/etcfuse-meta:latest

      - name: Build and push etcfuse image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile.etcfuse
          push: true
          tags: |
            ghcr.io/etcfs/etcfuse:${{ env.VERSION }}
            ghcr.io/etcfs/etcfuse:latest
